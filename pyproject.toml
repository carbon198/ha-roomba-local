[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --disable-socket --allow-unix-socket --cov=custom_components.roomba_local --cov-report=term-missing --cov-fail-under=96"

[tool.coverage.run]
branch = true
source = ["custom_components.roomba_local"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/roomba_local"]

[tool.ruff]
target-version = "py314"
line-length = 100
